apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-clickhouse-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/doctorspazz/tesseract.git
    targetRevision: HEAD
    path: data/clickhouse-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
