apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-clickhouse-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: data
  source:
    repoURL: https://github.com/doctorspazz/tesseract.git
    targetRevision: HEAD
    path: data/clickhouse-operator-bundle
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
