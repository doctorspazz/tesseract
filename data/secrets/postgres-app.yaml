apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-app-credentials
    creationPolicy: Owner
    template:
      data:
        username: app
        password: "{{ .appPassword }}"
  data:
    - secretKey: appPassword
      remoteRef:
        key: secret/data/postgres
        property: app-password
