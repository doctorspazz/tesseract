apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: ai-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-secrets
    creationPolicy: Owner
  data:
    - secretKey: nextauth-secret
      remoteRef:
        key: ai/langfuse
        property: secret-key
    - secretKey: salt
      remoteRef:
        key: ai/langfuse
        property: salt
    - secretKey: encryption-key
      remoteRef:
        key: ai/langfuse
        property: encryption-key
    - secretKey: pg-password
      remoteRef:
        key: data/postgres
        property: app-password
    - secretKey: ch-password
      remoteRef:
        key: data/clickhouse
        property: password
    - secretKey: redis-password
      remoteRef:
        key: data/redis
        property: redis-password
    - secretKey: minio-access-key
      remoteRef:
        key: data/minio
        property: root-user
    - secretKey: minio-secret-key
      remoteRef:
        key: data/minio
        property: root-password
