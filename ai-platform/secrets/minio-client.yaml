apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-client-credentials
  namespace: ai-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-client-credentials
    creationPolicy: Owner
  data:
    - secretKey: root-user
      remoteRef:
        key: data/minio
        property: root-user
    - secretKey: root-password
      remoteRef:
        key: data/minio
        property: root-password
