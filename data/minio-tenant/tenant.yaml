apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio
  namespace: data
spec:
  configuration:
    name: minio-env-configuration
  pools:
    - name: pool-0
      servers: 1
      volumesPerServer: 1
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
  requestAutoCert: false
