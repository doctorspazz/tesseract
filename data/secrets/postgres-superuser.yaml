apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-superuser-credentials
    creationPolicy: Owner
    template:
      data:
        username: postgres
        password: "{{ .superuserPassword }}"
  data:
    - secretKey: superuserPassword
      remoteRef:
        key: data/postgres
        property: superuser-password
