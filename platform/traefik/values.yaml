deployment:
  replicas: 1

service:
  type: LoadBalancer
  loadBalancerIP: "192.168.1.127"

ports:
  web:
    port: 80
    expose:
      default: true
  websecure:
    port: 443
    expose:
      default: true

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.home`)
    entryPoints: ["web"]

api:
  dashboard: true
  insecure: true

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true

logs:
  general:
    level: INFO
