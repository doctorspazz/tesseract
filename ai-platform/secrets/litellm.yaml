apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: ai-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
    template:
      data:
        master-key: "{{ .masterKey }}"
        database-url: "postgresql://app:{{ .pgPassword }}@postgres-rw.data.svc.cluster.local:5432/litellm"
        langfuse-public-key: "{{ .langfusePublicKey }}"
        langfuse-secret-key: "{{ .langfuseSecretKey }}"
  data:
    - secretKey: masterKey
      remoteRef:
        key: ai/litellm
        property: master-key
    - secretKey: pgPassword
      remoteRef:
        key: data/postgres
        property: app-password
    - secretKey: langfusePublicKey
      remoteRef:
        key: ai/litellm
        property: langfuse-public-key
    - secretKey: langfuseSecretKey
      remoteRef:
        key: ai/litellm
        property: langfuse-secret-key
