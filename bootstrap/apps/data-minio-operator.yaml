apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-minio-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
    - repoURL: https://operator.min.io/
      chart: operator
      targetRevision: "7.1.1"
      helm:
        valueFiles:
          - $values/data/minio-operator/values.yaml
    - repoURL: https://github.com/doctorspazz/tesseract.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
