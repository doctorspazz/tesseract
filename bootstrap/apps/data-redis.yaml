apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: data
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: redis
      targetRevision: "25.5.3"
      helm:
        valueFiles:
          - $values/data/redis/values.yaml
    - repoURL: https://github.com/doctorspazz/tesseract.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
