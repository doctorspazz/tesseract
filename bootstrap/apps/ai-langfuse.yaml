apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-langfuse
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  sources:
    - repoURL: https://langfuse.github.io/langfuse-k8s
      chart: langfuse
      targetRevision: "1.5.31"
      helm:
        valueFiles:
          - $values/ai-platform/langfuse/values.yaml
    - repoURL: https://github.com/doctorspazz/tesseract.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
