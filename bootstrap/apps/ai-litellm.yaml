apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-litellm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://github.com/doctorspazz/tesseract.git
    targetRevision: HEAD
    path: ai-platform/litellm
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
